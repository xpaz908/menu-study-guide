<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Toca Vez — Menu Study Ticket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --steel-dark: #232526;
    --steel: #34373a;
    --steel-light: #4b4f52;
    --paper: #f4efe2;
    --paper-shadow: #e3dcc6;
    --ink: #211c16;
    --ink-soft: #6b6255;
    --fire-red: #b3261e;
    --chalk-green: #2f5233;
    --brass: #a9782f;
    --brass-light: #c99a4a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: var(--steel-dark);
    background-image:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,0.03), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(255,255,255,0.025), transparent 45%);
    font-family: 'IBM Plex Mono', monospace;
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 24px 14px 60px;
  }

  .rail { width: 100%; max-width: 430px; }

  .rail-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0 6px 10px;
    color: var(--brass-light);
  }

  .rail-header .brand {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    letter-spacing: 0.14em;
    font-size: 13px;
    text-transform: uppercase;
  }

  .rail-header .score { font-size: 12px; letter-spacing: 0.05em; color: #cfc6b0; }

  .ticket {
    background: var(--paper);
    border-radius: 4px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset, 0 18px 40px rgba(0,0,0,0.45);
    position: relative;
    padding: 26px 22px 22px;
    overflow: hidden;
  }

  .ticket::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 10px;
    background: radial-gradient(circle at 8px 0, transparent 6px, var(--steel-dark) 6.5px) top left / 16px 10px repeat-x;
  }

  .ticket-eyebrow {
    text-align: center;
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    letter-spacing: 0.24em;
    color: var(--ink-soft);
    text-transform: uppercase;
    margin: 8px 0 2px;
  }

  .back-link {
    display: block;
    margin: 0 auto 6px;
    background: none;
    border: none;
    color: var(--brass);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px;
  }

  /* ---------- Menu screen ---------- */
  .menu-title {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    text-align: center;
    font-size: 24px;
    margin: 6px 0 2px;
  }
  .menu-subtitle {
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 18px;
  }
  .menu-list { list-style: none; margin: 0; padding: 0; }
  .menu-item {
    width: 100%;
    text-align: left;
    background: #fffdf8;
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    padding: 14px 16px;
    margin-bottom: 12px;
    cursor: pointer;
    font-family: inherit;
    display: block;
  }
  .menu-item:active { transform: translateY(1px); }
  .menu-item .mode-title {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 15.5px;
    text-transform: uppercase;
    color: var(--ink);
  }
  .menu-item .mode-desc {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 4px;
    line-height: 1.4;
  }
  .menu-group-label {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--brass);
    margin: 16px 0 8px;
  }
  .menu-group-label:first-of-type { margin-top: 0; }

  /* ---------- Game screen ---------- */
  .dish-name {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    text-align: center;
    font-size: 26px;
    line-height: 1.15;
    margin: 6px 0 4px;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
  }

  .prompt-label {
    text-align: center;
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }

  .given-ingredients {
    list-style: none;
    margin: 0 0 10px;
    padding: 0;
    font-size: 14px;
    text-align: center;
  }
  .given-ingredients li { padding: 3px 0; }

  .progress {
    text-align: center;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    margin-bottom: 14px;
    text-transform: uppercase;
  }

  .divider {
    border: none;
    border-top: 1px dashed var(--paper-shadow);
    border-bottom: 1px dashed rgba(255,255,255,0.6);
    margin: 0 0 14px;
  }

  .ingredient-list { list-style: none; margin: 0 0 16px; padding: 0; min-height: 40px; }
  .ingredient-list li { display: flex; align-items: baseline; gap: 8px; font-size: 14.5px; padding: 5px 0; line-height: 1.35; }
  .ingredient-list .mark { flex: none; width: 18px; font-weight: 700; }
  .ingredient-list .mark.correct { color: var(--chalk-green); }
  .ingredient-list .mark.skipped { color: var(--fire-red); }
  .ingredient-list .text.correct { color: var(--ink); }
  .ingredient-list .text.skipped { color: var(--ink-soft); text-decoration: line-through; }
  .ingredient-list .blank { color: var(--paper-shadow); letter-spacing: 2px; }

  .feedback { min-height: 20px; text-align: center; font-size: 13px; margin-bottom: 14px; font-weight: 500; }
  .feedback.correct { color: var(--chalk-green); }
  .feedback.wrong { color: var(--fire-red); }
  .feedback.neutral { color: var(--ink-soft); }

  form.entry-row { display: flex; gap: 8px; margin-bottom: 12px; }

  input[type="text"] {
    flex: 1;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px;
    padding: 12px 12px;
    border: 1.5px solid var(--ink);
    border-radius: 3px;
    background: #fffdf8;
    color: var(--ink);
  }
  input[type="text"]:focus { outline: 3px solid var(--brass-light); outline-offset: 1px; }

  button {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    -webkit-appearance: none;
  }
  button:focus-visible { outline: 3px solid var(--brass-light); outline-offset: 2px; }

  .btn-submit { background: var(--ink); color: var(--paper); font-size: 13px; padding: 0 18px; }
  .btn-submit:active { transform: translateY(1px); }

  .action-row { display: flex; gap: 10px; }
  .btn-skip, .btn-next { flex: 1; font-size: 12.5px; padding: 13px 8px; min-height: 44px; }
  .btn-skip { background: transparent; color: var(--fire-red); border: 1.5px solid var(--fire-red); }
  .btn-next { background: var(--chalk-green); color: var(--paper); }

  /* ---------- Matching mode choices ---------- */
  .choice-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }
  .choice-btn {
    background: #fffdf8;
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    padding: 10px 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    font-weight: 500;
    text-transform: none;
    letter-spacing: 0;
    color: var(--ink);
    min-height: 54px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.25;
  }
  .choice-btn:active { transform: translateY(1px); }
  .choice-btn.wrong {
    background: #ece7da;
    color: #a49d8c;
    border-color: #d8d1bd;
    text-decoration: line-through;
    pointer-events: none;
  }
  .choice-btn.correct-flash {
    background: var(--chalk-green);
    color: var(--paper);
    border-color: var(--chalk-green);
  }

  .stamp {
    position: absolute;
    top: 44%;
    left: 50%;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 44px;
    letter-spacing: 0.06em;
    color: var(--fire-red);
    border: 5px solid var(--fire-red);
    padding: 4px 18px;
    border-radius: 8px;
    text-transform: uppercase;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, -50%) rotate(-9deg) scale(2.4);
    mix-blend-mode: multiply;
  }
  .stamp.pass { color: var(--chalk-green); border-color: var(--chalk-green); }
  .stamp.show { animation: stampIn 0.4s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes stampIn {
    0%   { opacity: 0; transform: translate(-50%, -50%) rotate(-9deg) scale(2.4); }
    60%  { opacity: 1; transform: translate(-50%, -50%) rotate(-9deg) scale(0.92); }
    100% { opacity: 1; transform: translate(-50%, -50%) rotate(-9deg) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .stamp.show { animation: none; opacity: 1; transform: translate(-50%, -50%) rotate(-9deg) scale(1); }
  }

  .lap-banner {
    text-align: center;
    font-size: 11.5px;
    color: var(--brass-light);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 10px;
    min-height: 14px;
  }

  .footer-note { text-align: center; color: #857c6c; font-size: 11px; margin-top: 16px; letter-spacing: 0.03em; }

  .hidden { display: none !important; }

  @media (max-width: 360px) {
    .dish-name { font-size: 22px; }
    .stamp { font-size: 32px; }
  }
</style>
</head>
<body>

<div class="rail">
  <div class="rail-header">
    <span class="brand">Toca Vez &middot; Study Ticket</span>
    <span class="score" id="scoreDisplay">Score —</span>
  </div>

  <div class="ticket">
    <div class="stamp" id="stamp">Fired</div>

    <!-- ===== MENU SCREEN ===== -->
    <div id="menuScreen">
      <div class="menu-title">Pick a Drill</div>
      <div class="menu-subtitle">Choose how you want to be quizzed.</div>

      <div class="menu-group-label">Open-Ended (type it)</div>
      <ul class="menu-list">
        <li><button class="menu-item" data-mode="open-dish2ing">
          <div class="mode-title">Type the Ingredients</div>
          <div class="mode-desc">See the dish name, type each ingredient from memory.</div>
        </button></li>
        <li><button class="menu-item" data-mode="open-ing2dish">
          <div class="mode-title">Type the Dish</div>
          <div class="mode-desc">See the ingredient list, type the dish it belongs to.</div>
        </button></li>
      </ul>

      <div class="menu-group-label">Matching (multiple choice)</div>
      <ul class="menu-list">
        <li><button class="menu-item" data-mode="match-dish2ing">
          <div class="mode-title">Match the Ingredients</div>
          <div class="mode-desc">See the dish name, pick each ingredient from four choices.</div>
        </button></li>
        <li><button class="menu-item" data-mode="match-ing2dish">
          <div class="mode-title">Match the Dish</div>
          <div class="mode-desc">See the ingredient list, pick the correct dish from four choices.</div>
        </button></li>
      </ul>
    </div>

    <!-- ===== GAME SCREEN ===== -->
    <div id="gameScreen" class="hidden">
      <button type="button" class="back-link" id="backBtn">&larr; back to menu</button>

      <div class="ticket-eyebrow" id="modeEyebrow">Mode</div>

      <div class="dish-name hidden" id="dishName"></div>

      <div id="givenIngredientsWrap" class="hidden">
        <div class="prompt-label">Which dish is this?</div>
        <ul class="given-ingredients" id="givenIngredientsList"></ul>
      </div>

      <div class="progress" id="progressText"></div>

      <hr class="divider">

      <ul class="ingredient-list" id="ingredientList"></ul>

      <div class="feedback neutral" id="feedback">&nbsp;</div>

      <form class="entry-row" id="entryForm">
        <input type="text" id="entryInput" autocomplete="off" autocapitalize="off"
               autocorrect="off" spellcheck="false" placeholder="type your answer…">
        <button type="submit" class="btn-submit">Submit</button>
      </form>

      <div class="choice-grid hidden" id="choiceGrid"></div>

      <div class="action-row">
        <button type="button" class="btn-skip" id="skipBtn">Skip</button>
        <button type="button" class="btn-next" id="nextBtn">Next Dish</button>
      </div>

      <div class="lap-banner" id="lapBanner">&nbsp;</div>
    </div>
  </div>

  <div class="footer-note">Tap a field, type, hit enter. Score saves on this device.</div>
</div>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------
  // MENU DATA
  // ---------------------------------------------------------------
  const MENU = {
    // Appetizers
    "short rib empanada": ["shredded beef rib", "sofrito vegetable", "diced gold and sweet potato medley", "hominy corn", "pickled onion", "aji amarillo aioli"],
    "lobster quesadilla": ["roasted pepper", "onion", "monterey jack", "jalapeno aioli", "mango pico (salsa)"],
    "charred thick cut bacon": ["smoked bacon", "maple syrup glaze"],
    "house guacamole": ["smashed ripe avocado", "lime", "serrano pepper", "red onion", "cilantro"],
    "golden fried calamari": ["fried jalapeno", "chipotle aioli"],
    "tuna tostada": ["ahi tuna", "avocado", "cilantro", "chile aioli"],
    "garlic shrimp": ["smoky guajillo chili", "garlic", "lemon", "fresh herbs", "grilled crostini (grilled baguette)"],
    "charred octopus tostada": ["blue-corn tostadas", "black garlic aioli", "salsa macha", "pickled red onion", "cilantro", "lime"],
    "seared yellowfin tuna": ["sesame crusted sushi grade tuna", "sliced cucumber", "jalapeno", "grilled pineapple", "spicy avocado puree"],
    "chorizo-stuffed poblano peppers": ["sofrito rice", "spanish chorizo", "manchego", "morita salsa roja", "cilantro-lime crema", "pickled red onion"],
    "colossal shrimp cocktail": ["three jumbo shrimp", "cocktail sauce", "lemon wedge"],
    "queso fondue style": ["green chili", "warm tortilla chips", "chorizo ($5)"],

    // Tacos
    "al pastor taco": ["achiote marinated pork", "pineapple", "white onion", "cilantro", "avocado salsa verde"],
    "beef short rib taco": ["slow braised short rib", "mushroom", "asadero cheese", "pickled jalapeno and onion", "cilantro jalapeno cream"],
    "crispy chicken taco": ["braised chicken tinga", "jalapeno monterey cheese", "grilled corn tomato pico", "fresh cilantro", "salsa verde", "pickled red onion"],
    "veggie taco": ["chipotle lime marinated portobello mushroom", "mashed avocado", "pinto bean puree", "corn salsa", "pickled onion"],

    // Salads
    "caesar salad": ["romaine lettuce tossed with croutons", "parmesan", "caesar dressing"],
    "toca vez salad": ["romaine", "roasted corn", "avocado", "radish", "cherry tomato", "crispy tortilla", "cotija cheese", "lime cilantro dressing"],
    "wedge salad": ["cherry tomato", "raw onion", "bacon", "bleu cheese"],

    // Entrees
    "all natural half roasted chicken": ["herb marinated", "rice and black beans", "pepper and onion sofrito", "pickled jalapeno", "coconut cream"],
    "boneless beef short rib": ["mashed potato", "baby carrot", "fried shallots", "balsamic glaze (and red wine demi sauce)"],
    "pork chop": ["sweet potato au gratin", "haricot vert (french cut green bean)", "bacon lardons", "maple glaze"],
    "faroe island salmon fillet": ["charred scallion jasmine rice", "pepper and onion sofrito", "coconut citrus beurre blanc"],
    "colossal shrimp & lobster polenta": ["charred poblano polenta", "tomato", "roasted butternut squash", "sweet corn", "chile-lime dust", "seafood reduction"],
    "seared jumbo sea scallops": ["sweet corn", "edamame & fire roasted pepper succotash", "cilantro", "bacon lardons", "cranberry and mango chutney"],
    "chicken enchilada": ["queso fresco", "pinto bean puree", "cilantro lime rice", "salsa verde"],
    "chilean sea bass": ["sweet corn jasmine rice", "mixed vegetable escabeche coulis"]
  };

  const DISH_NAMES = Object.keys(MENU);
  const ALL_INGREDIENTS = [...new Set(DISH_NAMES.flatMap(d => MENU[d]))];

  // Each mode says: what's shown as the "given" info, what you're trying to
  // find ("target"), and whether you type the answer or pick from choices.
  const MODE_CONFIG = {
    "open-dish2ing": { given: "dish",        target: "ingredient", answer: "typed",  label: "Type the Ingredients" },
    "open-ing2dish": { given: "ingredients", target: "dish",       answer: "typed",  label: "Type the Dish" },
    "match-dish2ing": { given: "dish",        target: "ingredient", answer: "choice", label: "Match the Ingredients" },
    "match-ing2dish": { given: "ingredients", target: "dish",       answer: "choice", label: "Match the Dish" }
  };

  // ---------------------------------------------------------------
  // STATE
  // ---------------------------------------------------------------
  let mode = null;
  let dishPool = [];
  let currentDish = null;
  let remaining = [];   // items still to find this round (ingredients, or just [dishName])
  let revealed = [];    // [{text, status: 'correct' | 'skipped'}]
  let roundTotal = 0;
  let currentChoices = [];
  let currentTarget = null;
  let roundHadMistake = false; // any skip or wrong answer during the current round

  let scoreCorrect = Number(localStorage.getItem("tv_score_correct") || 0);
  let scoreTotal = Number(localStorage.getItem("tv_score_total") || 0);

  // ---------------------------------------------------------------
  // DOM
  // ---------------------------------------------------------------
  const menuScreen = document.getElementById("menuScreen");
  const gameScreen = document.getElementById("gameScreen");
  const backBtn = document.getElementById("backBtn");
  const modeEyebrow = document.getElementById("modeEyebrow");

  const dishNameEl = document.getElementById("dishName");
  const givenWrap = document.getElementById("givenIngredientsWrap");
  const givenListEl = document.getElementById("givenIngredientsList");
  const progressEl = document.getElementById("progressText");
  const listEl = document.getElementById("ingredientList");
  const feedbackEl = document.getElementById("feedback");
  const entryForm = document.getElementById("entryForm");
  const entryInput = document.getElementById("entryInput");
  const choiceGrid = document.getElementById("choiceGrid");
  const skipBtn = document.getElementById("skipBtn");
  const nextBtn = document.getElementById("nextBtn");
  const scoreDisplay = document.getElementById("scoreDisplay");
  const lapBanner = document.getElementById("lapBanner");
  const stampEl = document.getElementById("stamp");

  // ---------------------------------------------------------------
  // HELPERS
  // ---------------------------------------------------------------
  function normalize(str) {
    return str.toLowerCase().trim().replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " ");
  }

  function findMatch(guessRaw, pool) {
    const guess = normalize(guessRaw);
    if (!guess) return null;
    for (const item of pool) {
      const itemN = normalize(item);
      if (guess === itemN || itemN.includes(guess) || guess.includes(itemN)) return item;
    }
    return null;
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function sample(pool, excludeSet, count) {
    const options = pool.filter(x => !excludeSet.has(normalize(x)));
    return shuffle(options).slice(0, count);
  }

  function saveScore() {
    localStorage.setItem("tv_score_correct", scoreCorrect);
    localStorage.setItem("tv_score_total", scoreTotal);
  }

  function titleCase(str) {
    return str.replace(/\b\w/g, c => c.toUpperCase());
  }

  function refreshScoreDisplay() {
    scoreDisplay.textContent = scoreTotal > 0 ? `Score ${scoreCorrect}/${scoreTotal}` : "Score —";
  }

  // ---------------------------------------------------------------
  // MENU <-> GAME SCREEN
  // ---------------------------------------------------------------
  function showMenu() {
    mode = null;
    menuScreen.classList.remove("hidden");
    gameScreen.classList.add("hidden");
    refreshScoreDisplay();
  }

  function selectMode(modeKey) {
    mode = modeKey;
    menuScreen.classList.add("hidden");
    gameScreen.classList.remove("hidden");
    modeEyebrow.textContent = MODE_CONFIG[mode].label;
    newRoundPool();
    nextRound();
  }

  // ---------------------------------------------------------------
  // GAME LOGIC
  // ---------------------------------------------------------------
  function newRoundPool() {
    dishPool = shuffle(DISH_NAMES);
  }

  function nextRound() {
    stampEl.classList.remove("show", "pass");
    roundHadMistake = false;
    const cfg = MODE_CONFIG[mode];

    if (dishPool.length === 0) {
      newRoundPool();
      lapBanner.textContent = "Full lap through the menu complete — starting over";
    } else {
      lapBanner.textContent = "";
    }

    currentDish = dishPool.pop();

    // Unify: for target='ingredient' you're finding every ingredient of the dish;
    // for target='dish' you're finding one thing — the dish name itself.
    remaining = cfg.target === "ingredient" ? shuffle(MENU[currentDish]) : [currentDish];
    revealed = [];
    roundTotal = remaining.length;

    // "given" panel: either show the dish name, or show its full ingredient list
    if (cfg.given === "dish") {
      dishNameEl.textContent = titleCase(currentDish);
      dishNameEl.classList.remove("hidden");
      givenWrap.classList.add("hidden");
    } else {
      dishNameEl.classList.add("hidden");
      givenWrap.classList.remove("hidden");
      givenListEl.innerHTML = "";
      MENU[currentDish].forEach(ing => {
        const li = document.createElement("li");
        li.textContent = ing;
        givenListEl.appendChild(li);
      });
    }

    // typed vs choice UI
    if (cfg.answer === "typed") {
      entryForm.classList.remove("hidden");
      choiceGrid.classList.add("hidden");
      entryInput.value = "";
      entryInput.placeholder = cfg.target === "ingredient" ? "type an ingredient…" : "type the dish name…";
    } else {
      entryForm.classList.add("hidden");
      choiceGrid.classList.remove("hidden");
      buildChoiceQuestion();
    }

    feedbackEl.textContent = " ";
    feedbackEl.className = "feedback neutral";
    render();
    if (cfg.answer === "typed") entryInput.focus();
  }

  function render() {
    progressEl.textContent = `${revealed.length} / ${roundTotal} found`;
    refreshScoreDisplay();

    listEl.innerHTML = "";
    revealed.forEach(entry => {
      const li = document.createElement("li");
      const mark = document.createElement("span");
      const text = document.createElement("span");
      mark.className = "mark " + entry.status;
      text.className = "text " + entry.status;
      mark.textContent = entry.status === "correct" ? "✓" : "✗";
      text.textContent = MODE_CONFIG[mode].target === "dish" ? titleCase(entry.text) : entry.text;
      li.appendChild(mark);
      li.appendChild(text);
      listEl.appendChild(li);
    });
    remaining.forEach(() => {
      const li = document.createElement("li");
      const mark = document.createElement("span");
      const text = document.createElement("span");
      mark.className = "mark";
      mark.textContent = "?";
      text.className = "blank";
      text.textContent = "———————————";
      li.appendChild(mark);
      li.appendChild(text);
      listEl.appendChild(li);
    });

    if (remaining.length === 0) {
      if (roundHadMistake) {
        stampEl.textContent = "Fired";
        stampEl.classList.remove("pass");
        feedbackEl.textContent = "Dish complete — tap Next to continue";
        feedbackEl.className = "feedback neutral";
      } else {
        stampEl.textContent = "Pass";
        stampEl.classList.add("pass");
        feedbackEl.textContent = "Dish complete, all correct — tap Next to continue";
        feedbackEl.className = "feedback correct";
      }
      stampEl.classList.add("show"); // stamp always shows on completion now — red Fired on a skip, green Pass on a clean run
    }
  }

  // ---------- typed answer flow ----------
  function submitTyped() {
    const guess = entryInput.value;
    entryInput.value = "";
    if (!guess.trim() || remaining.length === 0) return;

    scoreTotal++;
    const match = findMatch(guess, remaining);

    if (match) {
      remaining = remaining.filter(i => i !== match);
      revealed.push({ text: match, status: "correct" });
      scoreCorrect++;
      feedbackEl.textContent = `Correct: ${MODE_CONFIG[mode].target === "dish" ? titleCase(match) : match}`;
      feedbackEl.className = "feedback correct";
    } else {
      feedbackEl.textContent = "Not quite — try again, or skip it";
      feedbackEl.className = "feedback wrong";
    }

    saveScore();
    render();
  }

  // ---------- choice answer flow ----------
  function buildChoiceQuestion() {
    if (remaining.length === 0) { choiceGrid.innerHTML = ""; return; }
    currentTarget = remaining[0];

    let distractors;
    if (MODE_CONFIG[mode].target === "ingredient") {
      const excludeSet = new Set(MENU[currentDish].map(normalize));
      distractors = sample(ALL_INGREDIENTS, excludeSet, 3);
    } else {
      const excludeSet = new Set([normalize(currentDish)]);
      distractors = sample(DISH_NAMES, excludeSet, 3);
    }

    currentChoices = shuffle([currentTarget, ...distractors]);
    renderChoices();
  }

  function renderChoices() {
    choiceGrid.innerHTML = "";
    currentChoices.forEach(choice => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "choice-btn";
      btn.textContent = MODE_CONFIG[mode].target === "dish" ? titleCase(choice) : choice;
      btn.addEventListener("click", () => handleChoiceClick(choice, btn));
      choiceGrid.appendChild(btn);
    });
  }

  function handleChoiceClick(choice, btnEl) {
    scoreTotal++;
    if (choice === currentTarget) {
      scoreCorrect++;
      btnEl.classList.add("correct-flash");
      feedbackEl.textContent = `Correct: ${MODE_CONFIG[mode].target === "dish" ? titleCase(choice) : choice}`;
      feedbackEl.className = "feedback correct";
      saveScore();
      setTimeout(() => {
        remaining = remaining.filter(i => i !== currentTarget);
        revealed.push({ text: currentTarget, status: "correct" });
        render();
        if (remaining.length > 0) buildChoiceQuestion();
        else choiceGrid.innerHTML = "";
      }, 350);
    } else {
      btnEl.classList.add("wrong");
      feedbackEl.textContent = "Not quite — try another option";
      feedbackEl.className = "feedback wrong";
      saveScore();
    }
  }

  // ---------- skip ----------
  function skipCurrent() {
    if (remaining.length === 0) return;
    roundHadMistake = true;
    const item = MODE_CONFIG[mode].answer === "choice" ? currentTarget : remaining[0];
    remaining = remaining.filter(i => i !== item);
    revealed.push({ text: item, status: "skipped" });
    feedbackEl.textContent = `Skipped — answer was: ${MODE_CONFIG[mode].target === "dish" ? titleCase(item) : item}`;
    feedbackEl.className = "feedback neutral";
    render();
    if (MODE_CONFIG[mode].answer === "choice") {
      if (remaining.length > 0) buildChoiceQuestion();
      else choiceGrid.innerHTML = "";
    }
  }

  // ---------------------------------------------------------------
  // EVENTS
  // ---------------------------------------------------------------
  document.querySelectorAll(".menu-item").forEach(btn => {
    btn.addEventListener("click", () => selectMode(btn.dataset.mode));
  });
  backBtn.addEventListener("click", showMenu);
  entryForm.addEventListener("submit", e => { e.preventDefault(); submitTyped(); });
  skipBtn.addEventListener("click", skipCurrent);
  nextBtn.addEventListener("click", nextRound);

  // ---------------------------------------------------------------
  // INIT
  // ---------------------------------------------------------------
  showMenu();
})();
</script>

</body>
</html>
